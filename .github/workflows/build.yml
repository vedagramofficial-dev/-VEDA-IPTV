name: Build VEDA IPTV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: |
          unzip -q VEDA-IPTV-first-version.zip -d /tmp/veda
          cp /tmp/veda/settings.gradle .
          cp /tmp/veda/build.gradle .
          cp /tmp/veda/gradle.properties .
          cp -R /tmp/veda/app ./app

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEDA-IPTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
